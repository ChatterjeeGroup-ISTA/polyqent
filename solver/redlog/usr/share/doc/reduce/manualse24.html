<!--l. 143--><p class="noindent" >The command <span 
class="pcrr8t-x-x-109">bye</span>; (or alternatively <span 
class="pcrr8t-x-x-109">quit</span>;)<a 
 id="dx33-49003"></a> stops the execution of REDUCE, closes all
open output ﬁles, and returns you to the calling program (usually the operating system).
Your REDUCE session is normally destroyed.
